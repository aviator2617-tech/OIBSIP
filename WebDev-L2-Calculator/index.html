
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>L2 Task1 Calculator</title>
    <link rel="stylesheet" href="style.css">
    
</head>
<body>

    <main class="calculator">
        <h1>Calculator!</h1>

        <div class="display">
            <div id="expression">0</div>
            <div id="result"> </div>
        </div>

        <div class="btns">
            <button data-action="clear" class="special">C</button>
            <button data-action="backspace" class="special">DEL</button>
            <button data-operator="/" class="operator">÷</button>
            <button data-operator="*" class="operator">×</button>

            <button data-number="7" class="num">7</button>
            <button data-number="8" class="num">8</button>
            <button data-number="9" class="num">9</button>
            <button data-operator="-" class="operator">−</button>

            <button data-number="4" class="num">4</button>
            <button data-number="5" class="num">5</button>
            <button data-number="6" class="num">6</button>
            <button data-operator="+" class="operator">+</button>

            <button data-number="1" class="num">1</button>
            <button data-number="2" class="num">2</button>
            <button data-number="3" class="num">3</button>
            <button data-action="equals" class="equals">=</button>
            
            <button data-number="." class="point">.</button>
            <button data-number="0" class="zero">0</button>
            
        </div>
    </main>
    <script src="script.js" defer></script>
</body>
</html>
